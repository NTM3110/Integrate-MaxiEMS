# MAXiEMS BMS kiosk: the system service discovers this Sway session safely.
output * dpms on
output DSI-1 transform 270
input type:touch {
    calibration_matrix 0 -1 1 1 0 0
}
exec /usr/bin/env sh -c '[ ! -x /opt/maxiems/current/helpers/maxiems-keyboard-controller ] || exec /opt/maxiems/current/helpers/maxiems-keyboard-controller'
