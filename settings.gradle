pluginManagement {
	plugins {
		id 'biz.aQute.bnd.workspace' version "${bnd_version}"
		id 'biz.aQute.bnd' version "${bnd_version}"
		id 'com.github.node-gradle.node' version "7.1.0"
		id 'org.barfuin.gradle.jacocolog' version '3.1.0'
		id 'org.sonarqube' version '7.2.0.6526'
	}
	repositories {
		maven {
			name = 'Central Portal Snapshots'
			url = 'https://central.sonatype.com/repository/maven-snapshots/'
			content {
				includeModule('io.openems', 'j2mod')
			}
		}
		maven {
			name = 'BndRepo'
			url = uri(bnd_releases)
			content {
				includeGroup('biz.aQute.bnd')
				includeGroup('biz.aQute.bnd.workspace')
			}
		}
		mavenLocal()
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'biz.aQute.bnd.workspace' apply false
}

rootProject.name = 'openems'

include ":doc"
include ":cnf"

apply from: file('tools/workspace/settings-layout.gradle')

gradle.projectsLoaded {
	aQute.bnd.build.Workspace.setDriver('gradle')
	aQute.bnd.build.Workspace.addGestalt('batch', null)
	def workspace = new aQute.bnd.build.Workspace(new File(rootDir, '.bnd-workspace'), 'cnf')
	workspace.setOffline(gradle.startParameter.offline)
	gradle.rootProject.ext.bndWorkspace = workspace
	gradle.rootProject.pluginManager.apply('biz.aQute.bnd.workspace')
	gradle.buildFinished { workspace.close() }
}
